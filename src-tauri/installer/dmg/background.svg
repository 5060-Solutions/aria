<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440">
  <!--
    Background of the macOS installer window (the DMG).
    Source for background.png / background@2x.png / background.tiff; rebuild
    them with `node scripts/generate-dmg-background.mjs`.

    Layout is tied to bundle.macOS.dmg in src-tauri/tauri.conf.json: Aria.app
    centred at (180, 180) and the Applications link at (480, 180), 128 px
    icons and labels drawn by Finder. The window is 660x428 because Finder's
    bounds include the ~28 pt title bar, leaving a 660x400 view; the art is
    laid out in that top 400 and the image runs 40 px further so a taller
    title bar never exposes a white strip, only crops plain gradient.

    The field is a mid-tone on purpose. Finder draws the icon labels black in
    light mode and white in dark mode, and a DMG background cannot follow the
    appearance, so it has to hold both: around L = 0.16 either reads at 4:1+.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c70c2"/>
      <stop offset="1" stop-color="#6a5fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="top" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#a99cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a99cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="barsFade">
      <rect x="0" y="336" width="660" height="64" fill="url(#fade)"/>
    </mask>
    <marker id="head" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="12" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2.5 1.5 L9 6 L2.5 10.5" fill="none" stroke="#ffffff" stroke-opacity="0.85"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="url(#field)"/>
  <rect width="660" height="440" fill="url(#top)"/>

  <!-- Soft light pools under the two icons. -->
  <ellipse cx="180" cy="176" rx="118" ry="100" fill="url(#glow)"/>
  <ellipse cx="480" cy="176" rx="118" ry="100" fill="url(#glow)"/>

  <!-- Drag arrow, from Aria toward Applications. -->
  <path d="M 268 166 C 318 128, 352 128, 398 160" fill="none" stroke="#ffffff"
        stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="0.5 8.5" marker-end="url(#head)"/>

  <!-- Hint. Labels sit at about y = 260; this stays clear of them. -->
  <text x="330" y="306" text-anchor="middle"
        font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" letter-spacing="0.1" fill="#ffffff" fill-opacity="0.92">Drag Aria to Applications to install</text>

  <!-- The waveform from the app icon, as a quiet border. -->
  <g fill="#ffffff" fill-opacity="0.10" mask="url(#barsFade)">
      <rect x="3.6" y="376.0" width="5" height="10.0" rx="2.5"/>
      <rect x="15.8" y="372.3" width="5" height="13.7" rx="2.5"/>
      <rect x="28.1" y="368.4" width="5" height="17.6" rx="2.5"/>
      <rect x="40.3" y="364.5" width="5" height="21.5" rx="2.5"/>
      <rect x="52.5" y="360.7" width="5" height="25.3" rx="2.5"/>
      <rect x="64.7" y="357.2" width="5" height="28.8" rx="2.5"/>
      <rect x="76.9" y="354.2" width="5" height="31.8" rx="2.5"/>
      <rect x="89.2" y="351.9" width="5" height="34.1" rx="2.5"/>
      <rect x="101.4" y="350.4" width="5" height="35.6" rx="2.5"/>
      <rect x="113.6" y="349.8" width="5" height="36.2" rx="2.5"/>
      <rect x="125.8" y="350.2" width="5" height="35.8" rx="2.5"/>
      <rect x="138.1" y="351.7" width="5" height="34.3" rx="2.5"/>
      <rect x="150.3" y="354.2" width="5" height="31.8" rx="2.5"/>
      <rect x="162.5" y="357.6" width="5" height="28.4" rx="2.5"/>
      <rect x="174.7" y="362.0" width="5" height="24.0" rx="2.5"/>
      <rect x="186.9" y="367.1" width="5" height="18.9" rx="2.5"/>
      <rect x="199.2" y="372.7" width="5" height="13.3" rx="2.5"/>
      <rect x="211.4" y="373.4" width="5" height="12.6" rx="2.5"/>
      <rect x="223.6" y="367.4" width="5" height="18.6" rx="2.5"/>
      <rect x="235.8" y="361.5" width="5" height="24.5" rx="2.5"/>
      <rect x="248.1" y="356.0" width="5" height="30.0" rx="2.5"/>
      <rect x="260.3" y="351.2" width="5" height="34.8" rx="2.5"/>
      <rect x="272.5" y="347.3" width="5" height="38.7" rx="2.5"/>
      <rect x="284.7" y="344.4" width="5" height="41.6" rx="2.5"/>
      <rect x="296.9" y="342.6" width="5" height="43.4" rx="2.5"/>
      <rect x="309.2" y="342.1" width="5" height="43.9" rx="2.5"/>
      <rect x="321.4" y="342.8" width="5" height="43.2" rx="2.5"/>
      <rect x="333.6" y="344.8" width="5" height="41.2" rx="2.5"/>
      <rect x="345.8" y="348.0" width="5" height="38.0" rx="2.5"/>
      <rect x="358.1" y="352.1" width="5" height="33.9" rx="2.5"/>
      <rect x="370.3" y="357.2" width="5" height="28.8" rx="2.5"/>
      <rect x="382.5" y="362.9" width="5" height="23.1" rx="2.5"/>
      <rect x="394.7" y="369.0" width="5" height="17.0" rx="2.5"/>
      <rect x="406.9" y="375.2" width="5" height="10.8" rx="2.5"/>
      <rect x="419.2" y="370.6" width="5" height="15.4" rx="2.5"/>
      <rect x="431.4" y="364.8" width="5" height="21.2" rx="2.5"/>
      <rect x="443.6" y="359.6" width="5" height="26.4" rx="2.5"/>
      <rect x="455.8" y="355.1" width="5" height="30.9" rx="2.5"/>
      <rect x="468.1" y="351.6" width="5" height="34.4" rx="2.5"/>
      <rect x="480.3" y="349.1" width="5" height="36.9" rx="2.5"/>
      <rect x="492.5" y="347.7" width="5" height="38.3" rx="2.5"/>
      <rect x="504.7" y="347.4" width="5" height="38.6" rx="2.5"/>
      <rect x="516.9" y="348.2" width="5" height="37.8" rx="2.5"/>
      <rect x="529.2" y="350.0" width="5" height="36.0" rx="2.5"/>
      <rect x="541.4" y="352.7" width="5" height="33.3" rx="2.5"/>
      <rect x="553.6" y="356.1" width="5" height="29.9" rx="2.5"/>
      <rect x="565.8" y="360.0" width="5" height="26.0" rx="2.5"/>
      <rect x="578.1" y="364.3" width="5" height="21.7" rx="2.5"/>
      <rect x="590.3" y="368.7" width="5" height="17.3" rx="2.5"/>
      <rect x="602.5" y="373.1" width="5" height="12.9" rx="2.5"/>
      <rect x="614.7" y="374.7" width="5" height="11.3" rx="2.5"/>
      <rect x="626.9" y="370.9" width="5" height="15.1" rx="2.5"/>
      <rect x="639.2" y="367.7" width="5" height="18.3" rx="2.5"/>
      <rect x="651.4" y="365.0" width="5" height="21.0" rx="2.5"/>
  </g>

  <text x="330" y="380" text-anchor="middle"
        font-family="Figtree, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="0.6" fill="#ffffff" fill-opacity="0.6">ARIA  ·  5060 SOLUTIONS</text>
</svg>
