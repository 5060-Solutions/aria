[package]
name = "aria"
version = "0.3.7"
description = "Aria - A modern SIP softphone by 5060 Solutions"
authors = ["5060 Solutions"]
license = "LicenseRef-Proprietary"
edition = "2021"

[features]
# On-device transcription of call recordings.
#
# The desktop already writes recordings as WAV, so this transcribes a finished
# file rather than tapping live RTP the way the mobile core does — no change to
# the media path, and nothing runs during the call itself.
ai = ["dep:aria-ai-core"]
# On-device summarisation on top of `ai`. Kept separate because it roughly
# doubles the C++ build and the on-disk footprint.
ai-summaries = ["ai", "aria-ai-core/stt-whisper-with-llm"]

default = []
# Use insecure file-based credential storage instead of OS keychain (dev only!)
dev-insecure = []

[lib]
name = "aria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
# Shared SIP protocol utilities

sip-5060 = { git = "https://github.com/5060-Solutions/5060-sip.git" }
rand = "0.8"
socket2 = "0.5"
tokio-util = "0.7.18"
bytes = "1.11.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std"] }
rustls-pki-types = "1"

# RTP media engine (local path for development, switch to git for release)
rtp-engine = { git = "https://github.com/5060-Solutions/rtp-engine.git", features = ["device", "srtp", "opus", "audio-proc"] }

# Filesystem utilities (for recordings directory)
dirs = "6"

# On-device transcription. Optional: a build without `ai` keeps the plain
# softphone, and the commands report it as unavailable at runtime.
aria-ai-core = { git = "https://github.com/5060-Solutions/aria-ai-core.git", optional = true, default-features = false, features = [
    "net",
    "disk-space",
    "insights",
    "stt-whisper",
] }

# HTTP client for Google People API
reqwest = { version = "0.12", features = ["json"] }
rustls-platform-verifier = "0.7.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# Secure credential storage - platform-specific keychain backends
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

# Must be repeated here: [patch.crates-io] only applies at a workspace root, so
# depending on aria-ai-core does not inherit its patches. They let whisper.cpp
# and llama.cpp share one ggml instead of each vendoring its own, which
# otherwise collides at link time. See ../../vendor/README.md.
# Git rather than a relative path: CI checks out only this repository, so
# ../../vendor does not exist there and cargo fails to load the source before
# it even builds. A path patch only works on a machine that happens to have the
# sibling checkout.
[patch.crates-io]
whisper-rs-sys = { git = "https://github.com/5060-Solutions/aria-vendor.git", package = "whisper-rs-sys" }
llama-cpp-sys-2 = { git = "https://github.com/5060-Solutions/aria-vendor.git", package = "llama-cpp-sys-2" }
