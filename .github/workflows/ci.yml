name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the check job only reads the repository.
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # rtp-engine's audio-proc feature builds WebRTC's audio processing module
      # from C++ source, which uses meson and ninja. Installed via pip rather
      # than each platform's package manager so all three runners get the same
      # version on PATH.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install meson and ninja
        run: pip install meson ninja

      # Without this meson finds mingw's g++ first, and abseil-cpp does not
      # compile against mingw's windows.foundation.h. MSVC is a first-class
      # abseil target, so point meson at it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1


      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Lint frontend
        run: pnpm lint

      - name: Type check frontend
        run: pnpm tsc --noEmit

      - name: Test frontend
        run: pnpm test

      # `--features ai-summaries` is what the release ships (on-device
      # transcription and summaries: whisper.cpp and llama.cpp built from
      # source), so CI checks, lints and tests the same build.
      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --features ai-summaries
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --features ai-summaries -- -D warnings
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --features ai-summaries
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
