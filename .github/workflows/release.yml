name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout rtp-engine
        uses: actions/checkout@v7
        with:
          repository: 5060-Solutions/rtp-engine
          path: rtp-engine

      - name: Link rtp-engine to expected path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -r "$GITHUB_WORKSPACE/rtp-engine" "$GITHUB_WORKSPACE/../rtp-engine"
          else
            ln -s "$GITHUB_WORKSPACE/rtp-engine" "$GITHUB_WORKSPACE/../rtp-engine"
          fi
        shell: bash

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # rtp-engine's audio-proc feature builds WebRTC's audio processing module
      # from C++ source, which uses meson and ninja. Installed via pip rather
      # than each platform's package manager so every runner gets the same
      # version on PATH. Both build jobs need it -- they each compile the Rust.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install meson and ninja
        run: pip install meson ninja

      # Without this meson finds mingw's g++ first, and abseil-cpp does not
      # compile against mingw's windows.foundation.h. MSVC is a first-class
      # abseil target, so point meson at it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows still enforces MAX_PATH (260) for the compiler, and the default
      # build path is far too deep for the bundled WebRTC sources: the longest
      # abseil file lands at ~302 characters and fails with C1083, while its
      # neighbours compile. Debug builds fit at ~204, which is why this only
      # bites the release target triple. Build somewhere short instead.
      - name: Shorten the build path
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:/t" >> $env:GITHUB_ENV

      # Windows binaries are Authenticode-signed *inside* `tauri build`
      # (bundle.windows.signCommand in src-tauri/windows-signing.conf.json),
      # so the installed aria.exe is signed too and the updater .sig files and
      # latest.json describe the signed bytes. Signing after the build and
      # re-uploading with --clobber gave the assets new IDs, which left
      # latest.json pointing at deleted assets: Windows clients never updated.
      - name: Install Azure Artifact Signing CLI
        if: runner.os == 'Windows'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            xvfb

      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      # The DMG window styling (background, icon positions) is an AppleScript
      # that drives Finder. Tauri skips it whenever CI=true, which GitHub
      # sets, so released DMGs were plain; TAURI_BUNDLER_DMG_IGNORE_CI turns
      # it back on. Finder automation on a hosted runner can still time out,
      # and a failed script fails the bundle, so this attempt may fail and
      # the next step then builds the plain DMG exactly as before. A styling
      # failure can cost a rebuild but never the release.
      - name: Build Tauri app
        id: tauri_build
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts and lets tauri-action emit latest.json.
          # Without these the release ships no update manifest and clients
          # silently never see the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read by artifact-signing-cli through signCommand (Windows only).
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aria ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Aria.'
          # Draft: every matrix job publishes to the same release, and
          # tauri-action writes the latest.json the auto-updater reads. A
          # job failing after others succeeded would otherwise point every
          # installed client at a release missing its platform's artifact.
          # The publish job below releases it once every build succeeds.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}${{ runner.os == 'Windows' && ' --config src-tauri/windows-signing.conf.json' || '' }}

      - name: Build Tauri app (plain DMG)
        if: steps.tauri_build.outcome == 'failure' && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts and lets tauri-action emit latest.json.
          # Without these the release ships no update manifest and clients
          # silently never see the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aria ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Aria.'
          # Draft: every matrix job publishes to the same release, and
          # tauri-action writes the latest.json the auto-updater reads. A
          # job failing after others succeeded would otherwise point every
          # installed client at a release missing its platform's artifact.
          # The publish job below releases it once every build succeeds.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # A build "succeeding" only means the bundle was produced. v0.5.0 was
      # built, signed, published and auto-updated to users -- and panicked on
      # the first line of startup, because nothing ever launched it. Launch the
      # artifact here and fail the release if it crashes on startup, so the
      # broken build stays in the draft and never reaches the updater. Runs on
      # every platform; Windows launches the signed binary it ships.
      - name: Smoke-launch the built app
        shell: bash
        run: scripts/smoke-launch.sh ${{ matrix.target }}

      # Fail the release if any shipped Windows binary is not validly
      # Authenticode-signed (signCommand failing quietly, or a file skipped).
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release"
          $files = @(Get-Item "$release/aria.exe") +
                   @(Get-ChildItem "$release/bundle/nsis/*.exe") +
                   @(Get-ChildItem "$release/bundle/msi/*.msi")
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($sig.Status) $($f.Name) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($files.Count -lt 3 -or $bad -gt 0) { exit 1 }

  build-macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout rtp-engine
        uses: actions/checkout@v7
        with:
          repository: 5060-Solutions/rtp-engine
          path: rtp-engine

      - name: Link rtp-engine to expected path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp -r "$GITHUB_WORKSPACE/rtp-engine" "$GITHUB_WORKSPACE/../rtp-engine"
          else
            ln -s "$GITHUB_WORKSPACE/rtp-engine" "$GITHUB_WORKSPACE/../rtp-engine"
          fi
        shell: bash

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # rtp-engine's audio-proc feature builds WebRTC's audio processing module
      # from C++ source, which uses meson and ninja. Installed via pip rather
      # than each platform's package manager so every runner gets the same
      # version on PATH. Both build jobs need it -- they each compile the Rust.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install meson and ninja
        run: pip install meson ninja

      # Without this meson finds mingw's g++ first, and abseil-cpp does not
      # compile against mingw's windows.foundation.h. MSVC is a first-class
      # abseil target, so point meson at it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1


      - name: Install frontend dependencies
        run: pnpm install

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      # The DMG window styling (background, icon positions) is an AppleScript
      # that drives Finder. Tauri skips it whenever CI=true, which GitHub
      # sets, so released DMGs were plain; TAURI_BUNDLER_DMG_IGNORE_CI turns
      # it back on. Finder automation on a hosted runner can still time out,
      # and a failed script fails the bundle, so this attempt may fail and
      # the next step then builds the plain DMG exactly as before. A styling
      # failure can cost a rebuild but never the release.
      - name: Build Tauri app (universal binary)
        id: tauri_build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts and lets tauri-action emit latest.json.
          # Without these the release ships no update manifest and clients
          # silently never see the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aria ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Aria.'
          # Draft: every matrix job publishes to the same release, and
          # tauri-action writes the latest.json the auto-updater reads. A
          # job failing after others succeeded would otherwise point every
          # installed client at a release missing its platform's artifact.
          # The publish job below releases it once every build succeeds.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Build Tauri app (universal binary, plain DMG)
        if: steps.tauri_build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the updater artifacts and lets tauri-action emit latest.json.
          # Without these the release ships no update manifest and clients
          # silently never see the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Aria ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install Aria.'
          # Draft: every matrix job publishes to the same release, and
          # tauri-action writes the latest.json the auto-updater reads. A
          # job failing after others succeeded would otherwise point every
          # installed client at a release missing its platform's artifact.
          # The publish job below releases it once every build succeeds.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      # Launch the universal bundle before it can be published. See the matrix
      # build job for why: a built-but-unlaunched binary shipped in v0.5.0.
      - name: Smoke-launch the built app
        shell: bash
        run: scripts/smoke-launch.sh universal-apple-darwin

  # Builds land in a draft so a partial release never reaches the updater.
  # Once every build has uploaded its artifacts and its share of latest.json,
  # publish it. If any build fails this never runs and the draft stays put.
  publish:
    needs: [build, build-macos-universal]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every URL in latest.json must download and pass the updater's
      # signature check, or installed clients silently stop updating.
      - name: Verify the updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          scripts/verify-updater-manifest.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
