# Throwaway: proves `tauri build --features ai` bundles and launches on every
# release target before release.yml carries the flag. No signing, no publish.
name: AI build dry run (throwaway)

on:
  workflow_dispatch:
  # A workflow on a branch cannot be dispatched until it exists on main, so
  # the dry run fires on pushes to its own branch instead.
  push:
    branches: [feat/ship-transcription]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install meson and ninja
        run: pip install meson ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Shorten the build path
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "CARGO_TARGET_DIR=C:/t" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            xvfb

      # Without TAURI_SIGNING_PRIVATE_KEY the updater-artifact step at the
      # very end fails after the bundles exist, so the exit code is not the
      # gate here: the bundle check and the smoke launch below are.
      - name: Build Tauri app (ai, unsigned)
        continue-on-error: true
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: pnpm tauri build --target ${{ matrix.target }} --features ai

      - name: Bundles produced, and their size
        shell: bash
        run: |
          rel="${CARGO_TARGET_DIR:-src-tauri/target}/${{ matrix.target }}/release"
          ls -la "$rel/bundle"/*/ 2>/dev/null || { echo "no bundle directory under $rel"; exit 1; }
          du -sh "$rel/bundle"/*/* 2>/dev/null || true
          case "$RUNNER_OS" in
            macOS) ls -d "$rel"/bundle/macos/*.app ;;
            Linux) ls "$rel"/bundle/appimage/*.AppImage ;;
            Windows) ls "$rel"/bundle/nsis/*.exe "$rel"/bundle/msi/*.msi ;;
          esac

      - name: Smoke-launch the built app
        shell: bash
        run: scripts/smoke-launch.sh ${{ matrix.target }}
