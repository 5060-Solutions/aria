# pnpm 11 no longer reads the "pnpm" field from package.json; settings live
# here instead. Both packages below run install scripts for legitimate reasons
# and were already approved via the old package.json setting:
#   esbuild — fetches its platform binary
#   sharp   — builds/links libvips bindings
#
# Deliberately no `packages:` key: this file carries settings only, so pnpm does
# not treat the repo as a workspace root (an earlier workspace file broke CI).
allowBuilds:
  esbuild: true
  sharp: true
