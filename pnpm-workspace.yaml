# pnpm 11 no longer reads the "pnpm" field from package.json; build approvals
# live here. The pnpm version is pinned via "packageManager" in package.json so
# CI and local dev agree — an earlier pnpm 9/11 split is what made a previous
# version of this file fail CI with "packages field missing or empty".
#
# esbuild fetches its platform binary; sharp builds/links libvips bindings.
allowBuilds:
  esbuild: true
  sharp: true
